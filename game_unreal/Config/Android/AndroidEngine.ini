bShowLaunchImage=False
; Hand tracking (6 Nov 2026, hands-first competition build): Meta's documented manifest entries for hand tracking
; version 2 and the high-frequency mode; the HAND_TRACKING permission and the optional handtracking feature are
; already emitted by the engine for bPackageForMetaQuest. Controllers stay optional.
ExtraApplicationSettings=<meta-data android:name="com.oculus.supportedDevices" android:value="quest2|questpro|quest3|quest3s" /><meta-data android:name="com.oculus.handtracking.version" android:value="V2.0" /><meta-data android:name="com.oculus.handtracking.frequency" android:value="HIGH" />

