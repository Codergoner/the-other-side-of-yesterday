; Android (Meta Quest 3) platform layer for the Release copy. Added 2 November 2026 as an explicit,
; recorded platform change (docs/RELEASE_PROGRESS.md, section "Quest 3 standalone"). This file is read
; only when building, cooking or running for Android; the Windows release profile in DefaultEngine.ini is
; unchanged. Values follow the Quest_20261025 project's verified 25 October configuration.

[/Script/EngineSettings.GameMapsSettings]
; The story map is the VR entry. Its World Settings override the game mode to the desktop
; BP_FirstPersonGameMode (inventory 4 Nov 2026), so the XR game mode is forced through the local map URL
; option, which the engine lets override a World Settings game mode.
GameDefaultMap=/Game/Quest/Maps/Verdant_Desktop
LocalMapOptions=?game=/Game/Quest/XR/BP_QuestGameMode.BP_QuestGameMode_C
GlobalDefaultGameMode=/Game/Quest/XR/BP_QuestGameMode.BP_QuestGameMode_C

[/Script/Engine.RendererSettings]
; Quest copy value; the Windows release profile keeps False.
r.Mobile.UseHWsRGBEncoding=True

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
