; Headset rendering profile for Meta Quest 3 (added 2 November 2026). The engine selects
; [Meta_Quest_3 DeviceProfile] on the device (BaseDeviceProfiles.ini matches DeviceMake "Oculus" and
; HMD system name "Meta Quest 3"); nothing here is applied on Windows, so the desktop gameplay profile
; (manual exposure bias -0.7, 4x MSAA forward, no Lumen / Nanite / virtual shadow maps) is untouched.
; The engine parent Android_OpenXR already sets Vulkan, mobile multi-view, ForceStartInVR, dynamic
; foveation (VRS), sg.ShadowQuality=2 and the Quest 3 Adreno occlusion settings. Values below are the
; first measured-profile candidate; device frame-time evidence under game_unreal/validation/quest3/
; records any later change.

[Meta_Quest_3 DeviceProfile]
DeviceType=Android
BaseProfileName=Android_OpenXR
; Quest 3 defaults kept from the engine profile.
+CVars=r.Mobile.Oculus.ForceSymmetric=1
+CVars=r.OcclusionFeedback.Enable=0
+CVars=r.Mobile.AdrenoOcclusionMode=1
+CVars=r.Vulkan.UseChunkedPSOCache=0
; Stereo rendering: native eye buffer, 4x MSAA on the forward mobile path (project default).
+CVars=vr.PixelDensity=1.0
+CVars=r.MSAACount=4
+CVars=r.Mobile.AntiAliasing=3
; Distance and detail budget for the 126 instanced components (16 058 instances) and the cast:
; primitives cull at 80 % of their desktop draw distance, static-mesh LODs switch 30 % earlier,
; foliage cards 40 % earlier, skeletal meshes drop one LOD.
+CVars=r.ViewDistanceScale=0.8
+CVars=r.StaticMeshLODDistanceScale=1.3
+CVars=foliage.LODDistanceScale=0.7
+CVars=r.SkeletalMeshLODBias=1
; Shadows the XR2 Gen 2 can afford: one directional cascade at 1024, shorter range, no distance-field
; or local-light shadows; sg.ShadowQuality=2 inherited from Android_OpenXR.
+CVars=r.Shadow.CSM.MaxMobileCascades=1
+CVars=r.Shadow.MaxCSMResolution=1024
+CVars=r.Shadow.DistanceScale=0.6
+CVars=r.Shadow.RadiusThreshold=0.04
+CVars=r.Mobile.AllowDistanceFieldShadows=0
+CVars=r.Mobile.EnableMovableSpotlightsShadow=0
; Post: no bloom cost beyond the authored 0.22, no motion blur, no depth of field (project defaults).
+CVars=r.MotionBlurQuality=0
+CVars=r.DepthOfFieldQuality=0
; Texture memory budget: world and normal maps at most 2048, sky dome textures at most 2048 (the two
; 5120x2560 HDR panoramas are mipped and grouped as Skybox so this cap applies on the headset only).
+TextureLODGroups=(Group=TEXTUREGROUP_World,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_WorldNormalMap,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_WorldSpecular,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_Skybox,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_Character,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_CharacterNormalMap,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)

[Meta_Quest_3S DeviceProfile]
DeviceType=Android
BaseProfileName=Meta_Quest_3
